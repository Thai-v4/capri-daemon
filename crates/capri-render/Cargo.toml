[package]
name = "capri-render"
description = "Rendu GPU de Capri (wgpu : Metal sur macOS, DirectX 12 sur Windows)."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cosmic-text = "0.19.0" # mise en forme et tracé du texte du bandeau, avec les polices du système
log = "0.4"
pollster = "1.0.1"
thiserror = "2"
wgpu = "30.0.1"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] } # échantillons de bandeau
naga = { version = "30.0.0", features = ["wgsl-in"] }
