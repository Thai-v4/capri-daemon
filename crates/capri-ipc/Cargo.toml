[package]
name = "capri-ipc"
description = "Le transport local entre capri-hook et Capri : socket Unix, tube nommé sous Windows, réservés à l'utilisateur."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

# Ce crate est chargé par capri-hook à chaque événement de Claude Code : il doit rester minuscule.
# Pas de winit, pas d'AppKit ici.
[dependencies]
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191" # identité du pair d'une socket (getpeereid, SO_PEERCRED)

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[lints]
workspace = true
