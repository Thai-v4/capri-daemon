[package]
name = "capri-platform"
description = "Ce qui touche au système : fenêtre overlay, curseur, clics, voix, micro, trousseau, fenêtre de réglages (macOS, Windows)."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# La description du formulaire de réglages que la fenêtre affiche (logique pure, sans dépendance).
capri-core = { path = "../capri-core" }
log = "0.4"
raw-window-handle = "0.6.2"
thiserror = "2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
# La liste des fenêtres des autres apps (CGWindowListCopyWindowInfo), sans aucune permission. Déjà
# tirés par wgpu et AppKit : aucun crate de plus, et rien qui compile du C.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGGeometry",
    "CGWindow",
] }
# Le trousseau de session (SecItem…). Déjà tiré par le TLS du système (native-tls) : aucun
# crate de plus.
security-framework = { version = "3.7.0", default-features = false }
dispatch2 = "0.3.1" # MainThreadBound : confier la vue à wgpu sans mentir sur les threads
objc2 = "0.6.5"
block2 = "0.6.2" # les blocs que le système rappelle : son du micro, texte reconnu
# La voix (AVSpeechSynthesizer) et le micro (AVAudioEngine).
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "AVAudioApplication", # la permission d'utiliser le micro
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioMixerNode", # la voix traitée : lecteur, mélangeur et unités d'effet
    "AVAudioMixing",
    "AVAudioNode",
    "AVAudioPlayerNode",
    "AVAudioTime",
    "AVAudioTypes",
    "AVAudioUnit",
    "AVAudioUnitDelay",
    "AVAudioUnitDistortion",
    "AVAudioUnitEQ",
    "AVAudioUnitEffect",
    "AVAudioUnitReverb",
    "AVSpeechSynthesis",
] }
# L'écoute : la reconnaissance vocale du système, faite sur l'appareil.
objc2-speech = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognitionTaskHint",
    "SFSpeechRecognizer",
    "SFTranscription",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2", # le minuteur de la voix traitée
    "NSArray",
    "NSBundle", # l'app a-t-elle le droit de demander le micro ?
    "NSDate", # avec NSRunLoop : laisser la voix finir, en ligne de commande
    "NSDictionary", # l'état d'un lecteur, seule clé lue de son annonce
    "NSDistributedNotificationCenter", # les annonces des lecteurs de musique connus
    "NSError",
    "NSLocale",
    "NSGeometry",
    "NSNotification",
    "NSRunLoop",
    "NSString",
    "NSThread", # les rappels de la voix traitée arrivent-ils sur le thread principal ?
    "NSTimer",
    "NSUndoManager", # oublier ce qu'on pourrait annuler dans un champ secret vidé
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication", # NSApplicationDidChangeScreenParametersNotification
    "NSButton", # la fenêtre de réglages : boutons et cases à cocher
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSMenu", # les options d'une liste déroulante
    "NSMenuItem",
    "NSPanel",
    "NSPopUpButton",
    "NSPopUpButtonCell",
    "NSResponder",
    "NSRunningApplication", # un lecteur cru en lecture tourne-t-il encore ? (et la fenêtre d'essai)
    "NSScreen",
    "NSScrollView",
    "NSClipView",
    "NSSearchField",
    "NSSearchFieldCell",
    "NSSecureTextField",
    "NSTabView",
    "NSTabViewItem",
    "NSText", # l'éditeur d'un champ en cours de saisie
    "NSTextField",
    "NSTextFieldCell",
    "NSView",
    "NSWindow",
    "objc2-core-foundation", # CGFloat, pour backingScaleFactor
    "objc2-quartz-core", # NSView.displayLink : réveiller la boucle à chaque rafraîchissement
] }
# Le CADisplayLink de la vue : quand elle suit sa fenêtre ou qu'on la tient, la boucle se réveille
# au rythme de l'écran (120 Hz en ProMotion). Déjà tiré par wgpu : aucun crate de plus.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CADisplayLink",
    "CAFrameRateRange",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm", # le cadre réel d'une fenêtre, et si elle est sur un autre bureau
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials", # le Gestionnaire d'identification, pour les clés d'API
    "Win32_System_Console", # lire une clé sans l'afficher
    "Win32_System_Threading", # le numéro de notre processus : nos fenêtres ne comptent pas
    "Win32_UI_Input_KeyboardAndMouse", # un bouton de la souris enfoncé : une fenêtre bouge peut-être
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
