[package]
name = "capri-platform"
description = "Ce qui touche au système : fenêtre overlay, curseur, clics (macOS, Windows)."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4"
raw-window-handle = "0.6.2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation", # CGFloat, pour backingScaleFactor
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
