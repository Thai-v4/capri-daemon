[package]
name = "capri-platform"
description = "Ce qui touche au système : fenêtre overlay, curseur, clics (macOS, Windows)."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4"
raw-window-handle = "0.6.2"
thiserror = "2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1" # MainThreadBound : confier la vue à wgpu sans mentir sur les threads
objc2 = "0.6.5"
# La voix : la synthèse vocale du système (AVSpeechSynthesizer).
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate", # avec NSRunLoop : laisser la voix finir, en ligne de commande
    "NSGeometry",
    "NSNotification",
    "NSRunLoop",
    "NSString",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication", # NSApplicationDidChangeScreenParametersNotification
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSTextField",
    "NSTextFieldCell",
    "NSView",
    "NSWindow",
    "objc2-core-foundation", # CGFloat, pour backingScaleFactor
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
