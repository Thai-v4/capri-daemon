[package]
name = "capri-claude"
description = "Ce que Capri sait de Claude Code : entrée des hooks, protocole, état des sessions, réglages. Aucune dépendance système."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order : réécrire settings.json sans changer l'ordre de ses clés
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2"

[lints]
workspace = true
