name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Un blocage échoue vite au lieu de durer des heures (le job complet prend une dizaine de
    # minutes sur macOS, cache vide compris).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        # Tous les crates, même quand l'un échoue : une exécution dit tout d'un coup.
        timeout-minutes: 20
        run: cargo test --workspace --no-fail-fast
      - name: Build release
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release -p capri-app -p capri-hook
      - uses: actions/upload-artifact@v4
        if: matrix.os != 'ubuntu-latest'
        with:
          name: capri-${{ matrix.os }}
          path: |
            target/release/capri
            target/release/capri.exe
            target/release/capri-hook
            target/release/capri-hook.exe
          if-no-files-found: ignore
