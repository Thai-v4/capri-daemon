[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
